# Coverage floors for correctness-critical modules (issue #16).
# Measured with: uv run pytest -q --cov=adventure_core --cov=adventure_gis
#   --cov=adventure_scoring --cov-report=json:coverage.json
# Packbuilder / network ingest paths are intentionally excluded from offline gates.

global_fail_under: 70

# Path suffix → minimum percent_covered (statements+branches as reported by coverage.py)
modules:
  adventure_core/intent.py: 95
  adventure_core/polarity.py: 85
  adventure_core/intent_validate.py: 75
  adventure_core/catalog_validate.py: 85
  adventure_core/interpreters.py: 90
  adventure_core/constraints.py: 75
  adventure_gis/pack_data.py: 85
  adventure_gis/pack_validate.py: 80
  adventure_gis/candidates.py: 80
  adventure_scoring/scorer.py: 80
  adventure_scoring/confidence.py: 75
