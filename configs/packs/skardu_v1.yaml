pack_id: skardu_v1
name: Skardu Corridor (OSM + Copernicus DEM)
bbox: [75.35, 35.20, 75.75, 35.50]
crs: EPSG:4326
feature_schema_version: "0.3.0"
synthetic: false
output_dir: data/packs/skardu_v1
notes: >
  Production Region Pack for the Skardu area. Candidates come from named
  deterministic generators over OpenStreetMap (ODbL) and Copernicus GLO-30 DEM.
  Not a tourist ranking — access/isolation/terrain from open geospatial evidence.
osm:
  method: geofabrik
  # Dated Geofabrik extract (not *-latest*) for reproducible builds (#60).
  geofabrik_url: https://download.geofabrik.de/asia/pakistan-260801.osm.pbf
  geofabrik_md5: 809f431e63dd87be8a69aea0e69c3fbe
  allow_latest: false
  cache_dir: data/cache
  cache_pbf: pakistan-260801.osm.pbf
  overpass_url: https://overpass-api.de/api/interpreter
  timeout_s: 180
dem:
  method: copernicus_glo30_aws
  resolution_m: 30
discovery:
  min_spacing_km: 0.6
  grid_res_deg: 0.02
  generators:
    track_terminus: { quota: 25, min_spacing_km: 0.8 }
    road_spur: { quota: 20, min_spacing_km: 0.8 }
    unnamed_waterbody: { quota: 20 }
    named_waterbody: { quota: 15 }
    isolation_maximum: { quota: 20, min_spacing_km: 1.2 }
    dem_local_max: { quota: 15, min_spacing_km: 1.0 }
    terrain_relief_hotspot: { quota: 15, min_spacing_km: 1.0 }
    osm_peak: { quota: 15 }
    osm_viewpoint: { quota: 10 }
sentinel2:
  enabled: false
  max_cloud_cover: 20
  indices: [ndvi, ndwi]
  # Pilot: precompute Point FC then set enabled: true + indices_geojson path
  # (see RFC-0006 / docs/pack-builder.md). Example:
  # indices_geojson: data/cache/sentinel2/skardu_v1_indices.geojson
  provider: Copernicus Sentinel-2 L2A via Earth Search (Element84)

vlm:
  enabled: false
  model: llava
  prompt_id: pack_vlm_v1
  # Pilot: precompute Point FC then set enabled: true + features_geojson
  # (see RFC-0007 / docs/pack-builder.md). Example:
  # features_geojson: data/cache/inference/vlm/skardu_v1_features.geojson
