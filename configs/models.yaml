# Local inference pins — Ollama only on default paths (no cloud API keys).
# Loaded by adventure_inference.models_config.

runtime: ollama
default_base_url: http://127.0.0.1:11434

default_model: llama3.2
mission_interpreter: llama3.2
# Pack-time vision labels (RFC-0007) — not used for mission ranking.
pack_vlm: llava

fallback:
  - llama3.2
  - llama3.1:8b
  - qwen3:8b
  - llama3.2:3b

# Approximate free-RAM floors for a usable local run (not hard gates).
hardware_floors:
  llama3.2:
    ram_gb: 4
    notes: "default 3B-class tag"
  llama3.2:3b:
    ram_gb: 4
    notes: "smaller fallback"
  llama3.1:8b:
    ram_gb: 8
    notes: ""
  qwen3:8b:
    ram_gb: 8
    notes: ""
  llava:
    ram_gb: 10
    notes: "pack-time VLM (RFC-0007); guidance only"
  moondream:
    ram_gb: 5
    notes: "smaller pack-time VLM option"

cache:
  # Adventure-managed artifacts (embeddings / pack-time VLM outputs).
  # Ollama weights stay in Ollama's store (~/.ollama), not here.
  inference_dir: data/cache/inference
