  experience.wildlife:
    label: Wildlife
    family: experience
    aliases: [wildlife]
    preferences:
      wildlife: 0.9
      forest: 0.4
      solitude: 0.3

  experience.geology:
    label: Geology
    family: experience
    aliases: [geology]
    preferences:
      geology: 0.9
      beauty: 0.3

  # --- risk ---
  risk.danger:
    label: Danger / challenge
    family: risk
    aliases: [danger]
    preferences:
      danger: 0.8
      accessibility: -0.3
