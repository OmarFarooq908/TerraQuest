name: Feature request
description: Propose a user-facing or library capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior. Note if it touches MissionIntent, catalog, or ranking.
    validations:
      required: true
  - type: checkboxes
    id: thesis
    attributes:
      label: Architecture check
      options:
        - label: This does not make an LLM invent coordinates or pick ranking winners
          required: true
        - label: I have read ROADMAP.md and this fits near-term priorities (or I explain why not)
          required: true
