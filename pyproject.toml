[project]
name = "adventure-ai"
version = "0.2.0"
description = "Local-first exploration intelligence — missions, not itineraries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "adventure-core",
  "adventure-gis",
  "adventure-scoring",
  "adventure-inference",
  "adventure-packbuilder",
  "adventure-cli",
]

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/gis",
  "packages/scoring",
  "packages/inference",
  "packages/packbuilder",
  "apps/cli",
]

[tool.uv.sources]
adventure-core = { workspace = true }
adventure-gis = { workspace = true }
adventure-scoring = { workspace = true }
adventure-inference = { workspace = true }
adventure-packbuilder = { workspace = true }
adventure-cli = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pre-commit>=4.0.0",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: fast offline unit tests",
  "integration: multi-package offline integration",
  "requires_osmium: needs osmium-tool on PATH",
  "requires_network: hits remote OSM/DEM endpoints",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "SIM108", "SIM102", "SIM110"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
packages = ["adventure_core"]
mypy_path = [
  "packages/core/src",
  "packages/gis/src",
  "packages/scoring/src",
  "packages/inference/src",
  "packages/packbuilder/src",
  "apps/cli/src",
]
explicit_package_bases = true
ignore_missing_imports = true

[tool.coverage.run]
# Offline CI gates cover core + gis + scoring only (issue #16).
# Packbuilder network ingest is excluded from fail_under / module floors.
source = [
  "packages/core/src",
  "packages/gis/src",
  "packages/scoring/src",
]
branch = true
omit = [
  "*/tests/*",
  "*/adventure_packbuilder/*",
  "*/adventure_inference/*",
  "*/adventure_cli/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
