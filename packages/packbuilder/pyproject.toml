[project]
name = "adventure-packbuilder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "adventure-core",
  "adventure-gis",
  "httpx>=0.27",
  "rasterio>=1.3",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
adventure-core = { workspace = true }
adventure-gis = { workspace = true }
